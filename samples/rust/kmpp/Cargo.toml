# Workspace umbrella (the analog of the KSP `cpp-samples.sln`): builds the shared
# helper crate plus every independent sample. Each `*-sign-verify` /
# `*-encrypt-decrypt` member is a standalone binary you can build and run on its
# own; they share only the `common` helper library.
[workspace]
resolver = "2"
members = [
    "common",
    "rsa-encrypt-decrypt",
    "rsa-sign-verify",
    "ecdsa-sign-verify",
]
